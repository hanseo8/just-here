<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제휴 쿠폰 발급 · 그냥여기</title><style>body{margin:0;background:#f7f7f8;color:#222226;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:24px}h1{color:#ff5a1f;font-size:26px}form{display:grid;gap:16px;background:white;border:1px solid #e8e8eb;border-radius:18px;padding:22px;margin:20px 0}label{display:grid;gap:6px;font-size:14px}input,textarea,button{box-sizing:border-box;max-width:100%;font:inherit;padding:12px;border:1px solid #ccc;border-radius:10px}button{background:#ff5a1f;color:white;min-height:48px;cursor:pointer}button:disabled{opacity:.45}p{line-height:1.6;overflow-wrap:anywhere}a{color:#c84010}</style><main><h1>제휴 쿠폰 발급</h1><a href="/admin/rewards">영수증 관리로</a><p>계약을 확인한 제휴 혜택만 발급합니다. 포인트 차감·송금 기능이 아닙니다.</p><form id="issue"><label>관리자 토큰<input id="token" type="password" autocomplete="off" required></label><label>2단계 인증번호<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><label>고객 UID<input name="uid" type="text" maxlength="200" required></label><label>지점 ID<input name="merchant_id" type="text" maxlength="200" required></label><label>지점 이름<input name="merchant_name" type="text" maxlength="200" required></label><label>제공 혜택<input name="benefit" type="text" maxlength="200" required></label><label>이용 조건<input name="terms" type="text" maxlength="1000" required></label><label>계약 확인 근거<input name="contract_reference" type="text" maxlength="200" required></label><label>만료일<input name="expires_at" type="datetime-local" maxlength="200" required></label><label><span><input id="consent" type="checkbox" required> 지점·혜택·이용 조건과 실제 제휴 계약을 확인했습니다.</span></label><button>제휴 쿠폰 발급</button></form><p id="result" role="status">토큰과 고객 정보를 브라우저 저장소에 보관하지 않습니다.</p></main><script src="/static/admin-auth.js?v=20261004-1"></script><script>
const form=document.getElementById('issue');let requestId=crypto.randomUUID();form.addEventListener('input',()=>{requestId=crypto.randomUUID()});form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button'),status=document.getElementById('result');button.disabled=true;try{const token=document.getElementById('token').value.trim();await JustHereAdminAuth.ensure(token,document.getElementById('otp').value.trim());const data=Object.fromEntries(new FormData(form));data.expires_at=new Date(data.expires_at).toISOString();data.request_id=requestId;const response=await fetch('/v1/admin/coupons',{method:'POST',headers:{'Content-Type':'application/json',...JustHereAdminAuth.headers(token)},body:JSON.stringify(data),cache:'no-store'});if(!response.ok)throw Error();const result=await response.json();status.textContent='발급 완료: '+result.coupon.merchant_name+' · '+result.coupon.benefit+' / '+result.coupon.id;}catch(_){status.textContent='발급 결과를 확인하지 못했습니다. 인증·기능 상태·입력값을 확인하세요. 같은 입력으로 재시도하면 중복 발급하지 않습니다.'}finally{button.disabled=false}};
</script></html>
