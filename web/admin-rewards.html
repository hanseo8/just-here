<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>영수증 검토 · 그냥여기</title>
  <style>
    :root{font-family:Arial,"Apple SD Gothic Neo",sans-serif;color:#183d2d;background:#f0f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}header,.toolbar,.summary,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{color:#ff5a1f}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #9cbfaa;border-radius:8px}input{min-width:280px}button{cursor:pointer;background:#fff}.primary{background:#ff5a1f;color:#fff;border-color:#ff5a1f}.reject{color:#b33a25}.summary{margin:18px 0}.metric{padding:14px 18px;border-radius:12px;background:#fff}.queue{display:grid;gap:14px}.card{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:16px;border:1px solid #d2e4d8;border-radius:14px;background:#fff}.card img{width:100%;height:240px;object-fit:contain;background:#eef4ef;border-radius:8px}.meta p{margin:5px 0}.flags{color:#b33a25}.reason{width:100%;margin-top:10px}.message{margin:12px 0;color:#426653}@media(max-width:700px){.card{grid-template-columns:1fr}.card img{height:300px}input{min-width:0;width:100%}}
  </style>
</head><body><main>
  <header><h1>영수증 검토</h1><a href="/analytics">통계</a></header>
  <section class="toolbar"><input id="token" type="password" placeholder="관리자 토큰"><select id="filter"><option value="pending">검토 중</option><option value="approved">승인</option><option value="rejected">반려</option><option value="all">전체</option></select><button id="load" class="primary">불러오기</button></section>
  <p id="message" class="message">관리자 토큰은 브라우저에 저장하지 않습니다.</p>
  <section id="summary" class="summary"></section><section id="queue" class="queue"></section>
</main><script>
  const $=id=>document.getElementById(id);let token='';
  function safe(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
  async function call(path,opts={}){const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Admin-Token':token,...(opts.headers||{})},cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||'요청 실패');return data}
  async function load(){token=$('token').value.trim();if(!token){$('message').textContent='관리자 토큰을 입력해 주세요.';return}try{const filter=$('filter').value;const data=await call('/v1/admin/rewards?status='+encodeURIComponent(filter));const c=data.summary?.receipts||{};$('summary').innerHTML=`<div class="metric">검토 중 <b>${c.pending||0}</b></div><div class="metric">승인 <b>${c.approved||0}</b></div><div class="metric">반려 <b>${c.rejected||0}</b></div><div class="metric">발행 <b>${data.summary?.points_issued||0}P</b></div>`;const rows=data.receipts||[];$('queue').innerHTML=rows.length?rows.map(card).join(''):'<p>해당 영수증이 없습니다.</p>';await Promise.all([...document.querySelectorAll('img[data-receipt]')].map(loadImage));$('message').textContent=`${rows.length}건을 불러왔습니다.`}catch(err){$('message').textContent='불러오지 못했습니다. 토큰과 기능 상태를 확인해 주세요.';$('queue').innerHTML=''}}
  function card(r){return `<article class="card" data-id="${safe(r.id)}"><img data-receipt="${safe(r.id)}" alt="영수증"><div class="meta"><h2>${safe(r.place_name)}</h2><p><b>${safe(r.menu_name||'메뉴 미상')}</b> · ${Number(r.amount_krw||0).toLocaleString()}원</p><p>결제 ${safe(r.purchased_at)} · 접수 ${safe(r.created_at)}</p><p>재방문 ${safe(r.review_return)} · ${safe((r.review_tags||[]).join(', '))}</p><p>${safe(r.review_note||'후기 없음')}</p><p class="flags">${safe((r.risk_flags||[]).join(', '))}</p><textarea class="reason" rows="2" placeholder="반려 사유 또는 검토 메모"></textarea><div class="actions"><button class="primary" onclick="decide('${safe(r.id)}',true)">300P 승인</button><button class="reject" onclick="decide('${safe(r.id)}',false)">반려</button></div></div></article>`}
  async function loadImage(img){const id=img.dataset.receipt;const res=await fetch('/v1/admin/rewards/'+encodeURIComponent(id)+'/image',{headers:{'X-Admin-Token':token},cache:'no-store'});if(!res.ok)return;img.src=URL.createObjectURL(await res.blob())}
  async function decide(id,approve){const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);const reason=el.querySelector('.reason').value.trim();if(!approve&&!reason){$('message').textContent='반려 사유를 입력해 주세요.';return}try{await call('/v1/admin/rewards/'+encodeURIComponent(id)+'/decision',{method:'POST',body:JSON.stringify({approve,reason})});$('message').textContent=approve?'300P를 적립했습니다.':'반려했습니다.';await load()}catch(err){$('message').textContent='처리하지 못했습니다.'}}
  $('load').onclick=load;$('filter').onchange=()=>token&&load();
</script></body></html>
