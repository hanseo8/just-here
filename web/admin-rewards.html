<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>영수증 검토 · 그냥여기</title>
  <style>
    :root{font-family:Arial,"Apple SD Gothic Neo",sans-serif;color:#183d2d;background:#f0f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}header,.toolbar,.summary,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{color:#ff5a1f}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #9cbfaa;border-radius:8px}input{min-width:280px}button{cursor:pointer;background:#fff}.primary{background:#ff5a1f;color:#fff;border-color:#ff5a1f}.reject{color:#b33a25}.summary{margin:18px 0}.metric{padding:14px 18px;border-radius:12px;background:#fff}.queue{display:grid;gap:14px}.card{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:16px;border:1px solid #d2e4d8;border-radius:14px;background:#fff}.card img{width:100%;height:240px;object-fit:contain;background:#eef4ef;border-radius:8px}.meta p{margin:5px 0}.flags{color:#b33a25}.reason{width:100%;margin-top:10px}.message{margin:12px 0;color:#426653}@media(max-width:700px){.card{grid-template-columns:1fr}.card img{height:300px}input{min-width:0;width:100%}}
  </style>
  <style>
    .payout-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.payout-stat{padding:14px;border-radius:12px;background:#e4f3e9}.payout-stat strong{display:block;margin-top:4px;font-size:18px}.payout-check{grid-column:1/-1;margin:0;padding:12px;border-radius:10px;background:#fff}.payout-check.warning{color:#b33a25;background:#fff0e5}.payout-item{padding:18px;border:1px solid #d2e4d8;border-radius:14px;background:#fff}.payout-item h3{margin:0 0 5px}.payout-item .muted{margin:0 0 14px;color:#577360;font-size:13px}.payout-item input{min-width:0;width:100%;margin-top:9px}.payout-item .payout-recipient{margin:10px 0;padding:12px;border-radius:9px;background:#f0f7f2;font-weight:700;overflow-wrap:anywhere}.payout-item .payout-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.payout-item .payout-actions button{flex:1}.no-transfer{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:13px}.no-transfer input{width:auto;margin:2px 0 0}@media(max-width:700px){.payout-summary{grid-template-columns:1fr 1fr}.payout-item .payout-actions{display:grid;grid-template-columns:1fr}}
  </style>
</head><body><main>
  <header><h1>영수증 검토</h1><a href="/analytics">통계</a></header>
  <section class="toolbar"><input id="token" type="password" placeholder="관리자 토큰"><input id="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="2단계 인증 설정 시 6자리 번호"><select id="filter"><option value="pending">검토 중</option><option value="approved">승인</option><option value="rejected">반려</option><option value="all">전체</option></select><button id="load" class="primary">불러오기</button></section>
  <p id="message" class="message">관리자 토큰은 브라우저에 저장하지 않습니다.</p>
  <section id="summary" class="summary"></section>
  <section aria-label="보상 운영 현황"><p id="budget-status" role="status"></p><button id="backup" disabled>포인트·영수증 백업 다운로드</button><p>백업에는 영수증 개인정보가 포함됩니다. 접근이 제한된 곳에 보관해 주세요.</p></section>
  <section id="queue" class="queue"></section>
  <h2>300원 계좌 지급</h2><p>실제 송금은 은행에서 진행합니다. 송금 여부가 불확실하면 반려·재송금하지 말고 거래 내역을 먼저 확인하세요.</p>
  <div id="payout-summary" class="payout-summary" aria-live="polite"></div>
  <div id="payout-queue" class="queue"></div><p id="payout-message" role="status"></p>
</main><script src="/static/admin-auth.js?v=20261004-1"></script><script>
  const $=id=>document.getElementById(id);let token='';
  function safe(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
  async function call(path,opts={}){await JustHereAdminAuth.ensure(token,$('otp').value.trim());const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...JustHereAdminAuth.headers(token),...(opts.headers||{})},cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||'요청 실패');return data}
  async function load(){token=$('token').value.trim();if(!token){$('message').textContent='관리자 토큰을 입력해 주세요.';return}try{const filter=$('filter').value;const data=await call('/v1/admin/rewards?status='+encodeURIComponent(filter));const c=data.summary?.receipts||{};$('summary').innerHTML=`<div class="metric">검토 중 <b>${c.pending||0}</b></div><div class="metric">승인 <b>${c.approved||0}</b></div><div class="metric">반려 <b>${c.rejected||0}</b></div><div class="metric">발행 <b>${data.summary?.points_issued||0}P</b></div>`;const rows=data.receipts||[];$('queue').innerHTML=rows.length?rows.map(card).join(''):'<p>해당 영수증이 없습니다.</p>';await Promise.all([...document.querySelectorAll('img[data-receipt]')].map(loadImage));$('message').textContent=`${rows.length}건을 불러왔습니다.`}catch(err){$('message').textContent='불러오지 못했습니다. 토큰·새 인증번호와 기능 상태를 확인해 주세요.';$('queue').innerHTML=''}}
  function card(r){return `<article class="card" data-id="${safe(r.id)}"><img data-receipt="${safe(r.id)}" alt="영수증"><div class="meta"><h2>${safe(r.place_name)}</h2><p><b>${safe(r.menu_name||'메뉴 미상')}</b> · ${Number(r.amount_krw||0).toLocaleString()}원</p><p>결제 ${safe(r.purchased_at)} · 접수 ${safe(r.created_at)}</p><p>재방문 ${safe(r.review_return)} · ${safe((r.review_tags||[]).join(', '))}</p><p>${safe(r.review_note||'후기 없음')}</p><p class="flags">${safe((r.risk_flags||[]).join(', '))}</p><textarea class="reason" rows="2" placeholder="반려 사유 또는 검토 메모"></textarea><div class="actions"><button class="primary" onclick="decide('${safe(r.id)}',true)">300P 승인</button><button class="reject" onclick="decide('${safe(r.id)}',false)">반려</button></div></div></article>`}
  async function loadImage(img){const id=img.dataset.receipt;const res=await fetch('/v1/admin/rewards/'+encodeURIComponent(id)+'/image',{headers:{...JustHereAdminAuth.headers(token)},cache:'no-store'});if(!res.ok)return;img.src=URL.createObjectURL(await res.blob())}
  async function decide(id,approve){const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);const reason=el.querySelector('.reason').value.trim();if(!approve&&!reason){$('message').textContent='반려 사유를 입력해 주세요.';return}try{await call('/v1/admin/rewards/'+encodeURIComponent(id)+'/decision',{method:'POST',body:JSON.stringify({approve,reason})});$('message').textContent=approve?'300P를 적립했습니다.':'반려했습니다.';await load()}catch(err){$('message').textContent='처리하지 못했습니다.'}}
  const loadQueue = load;
  load = async function() {
    $('backup').disabled = true;
    $('budget-status').textContent = '';
    await loadQueue();
    if (!token) return;
    try {
      const data = await call('/v1/admin/rewards');
      const s = data.summary || {};
      const available = Number.isFinite(s.claim_limit);
      $('backup').disabled = !available;
      $('budget-status').textContent = available
        ? `${data.rewards.enabled ? '모집 활성' : '모집 중지'} · 남은 접수 ${s.claims_remaining}/${s.claim_limit}건 · 검토 중 ${s.pending_points.toLocaleString()}P · 적립·검토 합계 ${s.committed_points.toLocaleString()}P`
        : '아직 보상 데이터가 없습니다.';
    } catch (_) { $('budget-status').textContent = '운영 현황을 불러오지 못했습니다.'; }
  };
  $('backup').onclick = async () => {
    $('backup').disabled = true;
    try {
      const response = await fetch('/v1/admin/rewards/backup', {headers:{...JustHereAdminAuth.headers(token)},cache:'no-store'});
      if (!response.ok) throw new Error('backup failed');
      const url = URL.createObjectURL(await response.blob());
      const link = document.createElement('a');
      link.href = url; link.download = 'rewards-backup.zip'; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      $('message').textContent = '백업 다운로드를 요청했습니다. 다운로드 파일을 확인해 주세요.';
    } catch (_) { $('message').textContent = '백업에 실패했습니다. 저장소와 영수증 파일을 확인해 주세요.'; }
    finally { $('backup').disabled = false; }
  };
  $('load').onclick=load;$('filter').onchange=()=>token&&load();
</script><script src="/static/admin-payouts.js?v=20261003-3"></script></body></html>
