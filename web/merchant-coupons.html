<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가게 쿠폰 확인 · 그냥여기</title><style>body{margin:0;background:#f7f7f8;color:#222226;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:24px}h1{color:#ff5a1f;font-size:26px}form{display:grid;gap:16px;background:white;border:1px solid #e8e8eb;border-radius:18px;padding:22px;margin:20px 0}label{display:grid;gap:6px;font-size:14px}input,textarea,button{box-sizing:border-box;max-width:100%;font:inherit;padding:12px;border:1px solid #ccc;border-radius:10px}button{background:#ff5a1f;color:white;min-height:48px;cursor:pointer}button:disabled{opacity:.45}p{line-height:1.6;overflow-wrap:anywhere}a{color:#c84010}</style><main><h1>가게 쿠폰 확인</h1><p>고객 MY 화면의 2분 사용 코드를 입력해 주세요. 가게 전용 키만 사용하며 관리자 토큰은 입력하지 마세요.</p><form id="check-form"><label>가게 전용 키<input id="key" type="password" autocomplete="off" minlength="32" maxlength="256" required></label><label>고객 사용 코드<input id="code" autocomplete="off" minlength="16" maxlength="16" pattern="[A-Fa-f0-9]{16}" required></label><button>쿠폰 확인</button></form><p id="result" role="status">코드를 확인한 뒤 실제 혜택을 제공할 때 사용 완료를 눌러 주세요.</p><button id="use" disabled>혜택 제공 · 사용 완료</button><p>사용 완료 후에는 다시 사용할 수 없어요. 키와 코드는 브라우저 저장소에 보관하지 않습니다.</p></main><script>
const form=document.getElementById('check-form'),use=document.getElementById('use'),result=document.getElementById('result');let checked='';
async function call(action){const response=await fetch('/v1/merchant/coupons/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Merchant-Key':document.getElementById('key').value},body:JSON.stringify({code:document.getElementById('code').value.trim()}),cache:'no-store'});if(!response.ok)throw Error();return (await response.json()).coupon}
form.addEventListener('input',()=>{checked='';use.disabled=true;result.textContent='정보가 바뀌었어요. 다시 확인해 주세요.'});
form.onsubmit=async e=>{e.preventDefault();use.disabled=true;checked='';const button=form.querySelector('button');button.disabled=true;try{const c=await call('check');checked=document.getElementById('code').value.trim();result.textContent=c.merchant_name+' · '+c.benefit+' / '+c.terms;use.disabled=false}catch(_){result.textContent='확인하지 못했어요. 키·지점·코드와 만료 여부를 확인해 주세요.'}finally{button.disabled=false}};
use.onclick=async()=>{if(checked!==document.getElementById('code').value.trim())return;use.disabled=true;try{await call('use');result.textContent='사용 완료됐어요. 다시 사용할 수 없어요.';checked='';document.getElementById('code').value=''}catch(_){checked='';result.textContent='결과를 확인하지 못했어요. 다시 쿠폰 확인을 해 주세요. 이미 사용된 쿠폰은 재사용되지 않습니다.'}};
</script></html>
