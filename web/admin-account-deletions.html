<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삭제 요청 검토 · 그냥여기</title><style>body{margin:0;background:#f7f7f8;color:#222226;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:24px}h1{color:#ff5a1f;font-size:26px}form{display:grid;gap:16px;background:white;border:1px solid #e8e8eb;border-radius:18px;padding:22px;margin:20px 0}label{display:grid;gap:6px;font-size:14px}input,textarea,button{box-sizing:border-box;max-width:100%;font:inherit;padding:12px;border:1px solid #ccc;border-radius:10px}button{background:#ff5a1f;color:white;min-height:48px;cursor:pointer}button:disabled{opacity:.45}p{line-height:1.6;overflow-wrap:anywhere}a{color:#c84010}</style></head><body><main><a href="/admin/rewards">영수증 관리</a><h1>계정 삭제 요청 검토</h1><p>삭제 요청 접수·검토용입니다. 실제 개인정보 삭제 또는 삭제 완료 처리는 실행하지 않습니다.</p><form id="login"><label>관리자 토큰<input id="token" type="password" autocomplete="off" required></label><label>2단계 인증번호<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button>요청 불러오기</button></form><p id="status" role="status"></p><section id="list"></section></main><script src="/static/admin-auth.js?v=20261004-1"></script><script>
const form=document.getElementById('login'),list=document.getElementById('list'),message=document.getElementById('status');async function call(path,method='GET'){const token=document.getElementById('token').value.trim();await JustHereAdminAuth.ensure(token,document.getElementById('otp').value.trim());const response=await fetch(path,{method,headers:JustHereAdminAuth.headers(token),cache:'no-store'});if(!response.ok)throw Error();return response.json()}
async function load(){list.replaceChildren();const data=await call('/v1/admin/account-deletions');for(const row of data.requests){const article=document.createElement('article'),text=document.createElement('p'),button=document.createElement('button');text.textContent=row.uid+' / '+row.id+' / '+row.status+' / '+row.created_at;button.textContent='검토 시작';button.disabled=row.status==='reviewing'||row.status==='withdrawn';button.onclick=async()=>{button.disabled=true;try{await call('/v1/admin/account-deletions/'+encodeURIComponent(row.id)+'/review','POST');await load()}catch(_){message.textContent='처리 결과를 확인하지 못했습니다. 목록을 다시 불러오세요.'}};const inspect=document.createElement('button');inspect.textContent='삭제 전 검사';inspect.onclick=async()=>{inspect.disabled=true;try{const report=await call('/v1/admin/account-deletions/'+encodeURIComponent(row.id)+'/preflight');const detail=document.createElement('p');const labels={receipt_review_pending:'영수증 검토 중',payout_pending:'지급 처리 중',balance_requires_resolution:'잔액 정리 필요',active_coupons_require_resolution:'사용 가능 쿠폰 정리 필요',request_withdrawn:'철회된 요청'};detail.textContent='영수증 '+report.counts.receipts+'건 · 지급 '+report.counts.payouts+'건 · 잔액 '+report.counts.balance_points+'P / '+(report.blockers.map(x=>labels[x]||x).join(', ')||'진행 중 거래 없음')+' / 실제 삭제 실행은 아직 차단되어 있습니다.';article.append(detail)}catch(_){message.textContent='삭제 전 검사를 불러오지 못했습니다.'}finally{inspect.disabled=false}};article.append(text,button,inspect);list.append(article)}message.textContent=data.requests.length+'건을 불러왔습니다. 실제 삭제는 실행하지 않습니다.'}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await load()}catch(_){message.textContent='인증 또는 요청 조회에 실패했습니다.'}finally{button.disabled=false}};
</script></body></html>
