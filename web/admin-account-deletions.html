<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삭제 요청 검토 · 그냥여기</title><style>body{margin:0;background:#f7f7f8;color:#222226;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:24px}h1{color:#ff5a1f;font-size:26px}form{display:grid;gap:16px;background:white;border:1px solid #e8e8eb;border-radius:18px;padding:22px;margin:20px 0}label{display:grid;gap:6px;font-size:14px}input,textarea,button{box-sizing:border-box;max-width:100%;font:inherit;padding:12px;border:1px solid #ccc;border-radius:10px}button{background:#ff5a1f;color:white;min-height:48px;cursor:pointer}button:disabled{opacity:.45}p{line-height:1.6;overflow-wrap:anywhere}a{color:#c84010}</style></head><body><main><a href="/admin/rewards">영수증 관리</a><h1>계정 삭제 요청 검토</h1><p>삭제 요청을 검토합니다. 실행 기능은 기본 비활성이며, 활성화·단일 인스턴스 점검·진행 요청 종료 확인 후 거래기록 없는 익명 계정만 활성 데이터를 삭제할 수 있습니다. 백업 정리는 별도이며 전체 삭제 완료로 표시하지 않습니다.</p><form id="login"><label>관리자 토큰<input id="token" type="password" autocomplete="off" required></label><label>2단계 인증번호<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button>요청 불러오기</button><button id="export-deletion-registry" type="button">최신 삭제 목록 내려받기</button></form><p id="status" role="status"></p><section id="list"></section></main><script src="/static/admin-auth.js?v=20261004-1"></script><script>
const form=document.getElementById('login'),list=document.getElementById('list'),message=document.getElementById('status');async function call(path,method='GET',body){const token=document.getElementById('token').value.trim();await JustHereAdminAuth.ensure(token,document.getElementById('otp').value.trim());const response=await fetch(path,{method,headers:{...JustHereAdminAuth.headers(token),'Content-Type':'application/json'},cache:'no-store',...(body?{body:JSON.stringify(body)}:{})});if(!response.ok)throw Error();return response.json()}
async function load(){list.replaceChildren();const data=await call('/v1/admin/account-deletions');for(const row of data.requests){const article=document.createElement('article'),text=document.createElement('p'),button=document.createElement('button');text.textContent=row.uid+' / '+row.id+' / '+row.status+' / '+row.created_at;button.textContent='검토 시작';button.disabled=!['requested'].includes(row.status);button.onclick=async()=>{button.disabled=true;try{await call('/v1/admin/account-deletions/'+encodeURIComponent(row.id)+'/review','POST');await load()}catch(_){message.textContent='처리 결과를 확인하지 못했습니다. 목록을 다시 불러오세요.'}};const inspect=document.createElement('button');inspect.textContent='삭제 전 검사';inspect.onclick=async()=>{inspect.disabled=true;try{const report=await call('/v1/admin/account-deletions/'+encodeURIComponent(row.id)+'/preflight');const detail=document.createElement('p');const labels={receipt_review_pending:'영수증 검토 중',payout_pending:'지급 처리 중',balance_requires_resolution:'잔액 정리 필요',active_coupons_require_resolution:'사용 가능 쿠폰 정리 필요',request_withdrawn:'철회된 요청',financial_records_retention_review:'거래기록 보존 범위 검토',identity_records_retention_review:'본인인증 기록 처리 검토',beta_participation_review:'테스트·참여비 확인'};detail.textContent='영수증 '+report.counts.receipts+'건 · 지급 '+report.counts.payouts+'건 · 잔액 '+report.counts.balance_points+'P / '+([...report.blockers,...(report.retention_review||[])].map(x=>labels[x]||x).join(', ')||'진행 중 거래 없음')+' / 실제 삭제 실행은 아직 차단되어 있습니다.';article.append(detail);const capability=report.active_data_execution;if(capability){const p=document.createElement('p');p.textContent=capability.enabled?(capability.eligible?'활성 데이터 삭제 대상입니다. 백업 정리는 별도로 남습니다.':'실행 보류: '+capability.blockers.join(', ')):'실제 삭제 실행은 비활성 상태입니다.';article.append(p);if(capability.enabled&&capability.eligible){const confirmId=document.createElement('input');confirmId.placeholder='실행 대상 접수번호를 그대로 입력';confirmId.setAttribute('aria-label','삭제 확인 접수번호');const execute=document.createElement('button');execute.textContent='활성 계정·이용 기록 영구 삭제';execute.onclick=async()=>{if(confirmId.value!==row.id){message.textContent='해당 접수번호를 정확히 입력하세요.';return}if(!window.confirm('이 계정의 활성 프로필·기기 연결·이용 기록을 영구 삭제합니다. 되돌릴 수 없으며 백업 정리는 별도입니다. 실행할까요?'))return;execute.disabled=true;try{const result=await call('/v1/admin/account-deletions/'+encodeURIComponent(row.id)+'/execute','POST',{confirm_request_id:confirmId.value,confirm_permanent:true});message.textContent=result.status==='active_data_deleted'?'활성 데이터 삭제 확인. 백업 정리 대기이며 전체 삭제 완료가 아닙니다.':'처리 상태를 다시 확인하세요.';await load()}catch(_){message.textContent='실행 결과를 확인하지 못했습니다. 점검 모드·진행 요청·차단 사유를 확인하고 같은 접수번호로 상태를 다시 검사하세요.'}finally{execute.disabled=false}};article.append(confirmId,execute)}}}catch(_){message.textContent='삭제 전 검사를 불러오지 못했습니다.'}finally{inspect.disabled=false}};article.append(text,button,inspect);list.append(article)}message.textContent=data.requests.length+'건을 불러왔습니다. 활성 데이터 삭제와 백업 정리 완료는 구분됩니다.'}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await load()}catch(_){message.textContent='인증 또는 요청 조회에 실패했습니다.'}finally{button.disabled=false}};
document.getElementById('export-deletion-registry').onclick=async()=>{const button=document.getElementById('export-deletion-registry');button.disabled=true;try{const data=await call('/v1/admin/account-deletions/registry');const blob=new Blob([JSON.stringify(data.deletion_registry,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='deletion-registry-current.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='최신 삭제 목록을 내려받았습니다. 백업 밖에 비공개로 보관하고, 복구 적용 직전에 다시 내려받아 사용하세요. 원본 백업 파기 완료를 의미하지 않습니다.';}catch(_){message.textContent='삭제 목록을 내보내지 못했습니다. 관리자 인증과 목록 무결성을 확인해 주세요.'}finally{button.disabled=false}};
</script></body></html>
